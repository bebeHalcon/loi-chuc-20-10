<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5dfe1" />
    <title>Lời chúc 20/10</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        font-family: "Be Vietnam Pro", "Segoe UI", sans-serif;
        color: #573f3e;
        background: #f4e7df;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 12% 10%, #fff8eb, transparent 36%),
          radial-gradient(ellipse at 90% 90%, #e7cbd1, transparent 35%),
          linear-gradient(135deg, #f8e7df, #efdae0 55%, #f6e9dd);
      }

      .chooser {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(520px, 100%);
        padding: clamp(28px, 7vw, 48px);
        border: 1px solid #fff9f0;
        border-radius: 26px;
        background: #fffaf4ed;
        box-shadow: 0 28px 80px #79565725;
        text-align: center;
      }

      .flower {
        margin: 0 0 10px;
        font-size: 38px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #b96773;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: "DM Serif Display", Georgia, serif;
        font-size: clamp(34px, 8vw, 46px);
        font-weight: 400;
        line-height: 1.08;
      }

      .intro {
        margin: 14px 0 26px;
        color: #9a7776;
        font-size: 13px;
        line-height: 1.8;
      }

      .recipients {
        display: grid;
        gap: 12px;
      }

      .recipient {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        padding: 16px;
        border: 1px solid #e8cbc6;
        border-radius: 18px;
        background: #fffdf9;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition:
          border-color 160ms ease,
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      .recipient:hover,
      .recipient:focus-visible {
        transform: translateY(-2px);
        border-color: #cf8c91;
        box-shadow: 0 10px 24px #79565718;
        outline: none;
      }

      .icon {
        display: grid;
        flex: 0 0 52px;
        width: 52px;
        height: 52px;
        place-items: center;
        border-radius: 15px;
        background: #f8e8e5;
        font-size: 25px;
      }

      .recipient-copy {
        display: grid;
        gap: 4px;
      }

      .recipient-copy strong {
        font-size: 15px;
      }

      .recipient-copy span {
        color: #9a7776;
        font-size: 12px;
        line-height: 1.5;
      }

      .arrow {
        margin-left: auto;
        color: #bd7f83;
        font-size: 24px;
      }

      .experience,
      [hidden] {
        display: none;
      }

      .experience:not([hidden]) {
        display: block;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100vh;
        height: 100svh;
        border: 0;
        background: #f4e7df;
      }

      @media (max-width: 480px) {
        .chooser {
          padding: 14px;
        }

        .card {
          border-radius: 22px;
        }

        .recipient {
          padding: 13px;
        }
      }
    </style>
  </head>
  <body>
    <main class="chooser" id="chooser">
      <section class="card" aria-labelledby="title">
        <p class="flower" aria-hidden="true">🌷</p>
        <p class="eyebrow">20 · 10 · Một món quà nhỏ</p>
        <h1 id="title">Lời chúc dành riêng</h1>
        <p class="intro">Chọn người nhận để mở lời chúc và album ảnh nhé ♡</p>
        <div class="recipients">
          <button class="recipient" type="button" data-recipient="me">
            <span class="icon" aria-hidden="true">🌷</span>
            <span class="recipient-copy">
              <strong>Dành cho mẹ</strong>
              <span>Một lời chúc thật dịu dàng</span>
            </span>
            <span class="arrow" aria-hidden="true">↗</span>
          </button>
          <button class="recipient" type="button" data-recipient="nguoi-yeu">
            <span class="icon" aria-hidden="true">💌</span>
            <span class="recipient-copy">
              <strong>Dành cho người yêu</strong>
              <span>Một món quà nhỏ dành riêng cho em</span>
            </span>
            <span class="arrow" aria-hidden="true">↗</span>
          </button>
        </div>
      </section>
    </main>
    <main class="experience" id="experience" hidden>
      <iframe id="greeting" title="Lời chúc 20/10"></iframe>
    </main>
    <script>
      const chooser = document.getElementById("chooser");
      const experience = document.getElementById("experience");
      const greeting = document.getElementById("greeting");

      document.querySelectorAll("[data-recipient]").forEach((button) => {
        button.addEventListener("click", () => {
          greeting.src = `./${button.dataset.recipient}.html`;
          chooser.hidden = true;
          experience.hidden = false;
        });
      });
    </script>
  </body>
</html>
